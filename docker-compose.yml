version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: rateguard-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: rateguard-postgres
    environment:
      POSTGRES_DB: rateguard
      POSTGRES_USER: rateguard
      POSTGRES_PASSWORD: rateguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateguard -d rateguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-service:
    build:
      context: ./services/orders
    container_name: rateguard-orders
    environment:
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"

  inventory-service:
    build:
      context: ./services/inventory
    container_name: rateguard-inventory
    environment:
      PORT: 3002
      NODE_ENV: production
    ports:
      - "3002:3002"

  gateway-1:
    build:
      context: ./gateway
    container_name: rateguard-gateway-1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rateguard
      POSTGRES_USER: rateguard
      POSTGRES_PASSWORD: rateguard
      ORDERS_SERVICE_URL: http://orders-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      APP_ENV: production
      ADMIN_API_KEY: admin-key-123
      INSTANCE_NAME: gateway-1
    ports:
      - "8081:8080"

  gateway-2:
    build:
      context: ./gateway
    container_name: rateguard-gateway-2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: rateguard
      POSTGRES_USER: rateguard
      POSTGRES_PASSWORD: rateguard
      ORDERS_SERVICE_URL: http://orders-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      APP_ENV: production
      ADMIN_API_KEY: admin-key-123
      INSTANCE_NAME: gateway-2
    ports:
      - "8082:8080"

  nginx-lb:
    image: nginx:1.27-alpine
    container_name: rateguard-nginx
    depends_on:
      - gateway-1
      - gateway-2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  dashboard:
    build:
      context: ./dashboard
    container_name: rateguard-dashboard
    ports:
      - "5173:5173"
    environment:
      VITE_WS_URL: http://gateway:8080
      VITE_API_URL: http://gateway:8080

volumes:
  postgres_data:
